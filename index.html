<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&amp;S Fire Apparatus Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>

<body onresize="resize();">

    <div class="container-xl px-0">

        <header class="container-xl d-inline-flex" id="header">

            <nav class="navbar navbar-expand-md" id="nav-bar">
                <img src="images/white256.png" alt="S&amp;S Logo" id="header-img" class="navbar-brand">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                    aria-controls="main-nav" aria-expanded="false" aria-label="Toggle Navigation">
                    <div class="span navbar-toggler-icon"></div>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="main-nav">
                    <ul class="navbar-nav">
                        <li class="nav-link nav-item pt-3 px-5 d-inline-block text-white">
                            <a href="#products">Products</a>
                        </li>
                        <li class="nav-link nav-item pt-3 px-5 d-inline-block text-white">
                            <a href="#demo">Demo</a>
                        </li>
                        <li class="nav-link nav-item pt-3 px-5 d-inline-block text-white">
                            <a href="#contact">Contact</a>
                        </li>
                    </ul>
                </div>
            </nav>

    </div>

    </header>

    <main id="content" class="container-xl">

        <h1 class="pt-5" id="products"></h1>
        <h1 class="display-4 text-center pt-4 pt-5-md text-white">
            Products
        </h1>

        <div id="carouselMain" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="images/infinity.jpg" class="apparatus d-block mx-auto" alt="Infinity III&reg;">
                </div>
                <div class="carousel-item ">
                    <img src="images/indure.jpg" class="apparatus d-block mx-auto" alt="Indure&trade;">
                </div>
                <div class="carousel-item ">
                    <img src="images/highland.jpg" class="apparatus d-block mx-auto" alt="Highland&trade;">
                </div>
                <div class="carousel-item ">
                    <img src="images/outland.jpg" class="apparatus d-block mx-auto" alt="Outland&trade;">
                </div>
                <div class="carousel-item ">
                    <img src="images/wildland.jpg" class="apparatus d-block mx-auto" alt="Wildland&reg;">
                </div>
                <div class="carousel-item ">
                    <img src="images/wildlandx.jpg" class="apparatus d-block mx-auto"
                        alt="Wildland&reg; Ultra XT&trade;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselMain" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselMain" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>


        <h1 class="pt-5" id="demo"></h1>
        <h1 class="container-xl display-4 text-center pt-5 mb-3 text-white">
            Demo
        </h1>

        <div class="iframe-container container-md">
            <iframe width="480" src="https://www.youtube.com/embed/v-f4P7mrGIk?si=u0Ksz-o8M7TLKB4Q"
                title="Wildland Ultra XT&trade;" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" id="video" allowfullscreen></iframe>
        </div>


        <h1 class="pt-5" id="contact"></h1>
        <h1 class="container-xl display-4 text-center pt-5 mb-3 text-white">
            Contact
        </h1>
        <div class="container-xl text-center">
            <form action="https://www.freecodecamp.com/email-submit" id="form"
                class="w-50 d-inline-block d-md-inline-flex m-auto pb-5">
                <input type="email" aria-describedby="emailHelp" name="email" id="email"
                    class="align-items-baseline form-control d-inline-block mx-2">
                <input type="submit" value="Submit" id="submit" class="btn btn-primary form-control d-inline-block mx-2"
                    style="width:96px;">
            </form>
        </div>

    </main>

    <script>
        resize();

        function resize() {
            var sub = window.innerWidth > 500 ? "Subscribe to our newsletter!" : "Subscribe";
            document.getElementById('email').setAttribute('placeholder', sub);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>


</body>

</html>
